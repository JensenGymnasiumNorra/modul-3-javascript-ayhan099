<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uppgift 6+: Onward</title>
  </head>

  <body>
    <h2>Gissa ett tal mellan 1 och 15</h2>

    <input type="number" id="guess" />
    <button onclick="checkGuess()">Gissa</button>

    <p id="result"></p>

    <script>
      function checkGuess() {
        var guess = document.getElementById("guess").value;
        var correctNumber = 10;

        if (guess == correctNumber) {
          document.getElementById("result").innerText = "Rätt gissat";
        } else {
          document.getElementById("result").innerText = "Fel gissat";
        }
      }
    </script>
  </body>
</html>
