<!--
    Använd från genomgången (som ligger i filen nedan) för att skapa en miniräknare som fungerar för + - / *
    Extrauppgift 1: Ändra inputfälten till sliders
    Extrauppgift 2: Lägg till en dropdown för räknesätt och en knapp som utför beräkningen
    Extrauppgift 3: Lägg till en knapp som lägger till en till slider/inputfält som ska ingå i beräkningen
    För extrauppgift 3 krävs getElementsByClass
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator Example</title>
  </head>

  <body>
    <input type="range" id="num1" min="0" max="100" value="50" oninput="updateValues()" />
<span id="value1">50</span>

<br />

<input type="range" id="num2" min="0" max="100" value="50" oninput="updateValues()" />
<span id="value2">50</span>


    <br /><br />
    <select id="operator">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
</select>

<br /><br />

<button onclick="calculate()">Beräkna</button>


    <p id="result">Result:</p>

    <script src="simple_calculator.js"></script>
  </body>
  <img src="https://i0.wp.com/calmatters.org/wp-content/uploads/2021/08/math-curriculum.jpg?fit=1200%2C900&ssl=1" alt="" width="300">

</html>
