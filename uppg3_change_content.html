<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uppgift 3: Change content</title>
    <style>
      .recipe {
        display: none;
      }
    </style>
  </head>

  <body>
    <button onclick="showCarbonara()">Show carbonara ingredients</button>
    <button onclick="showPizza()">Show pizza ingredients</button>

    <div id="ingredients"></div>

    <script>
      function showCarbonara() {
        document.getElementById("ingredients").innerHTML = `
          <h2>Carbonara – Ingredienser</h2>
          <ul>
            <li>Pasta</li>
            <li>Ägg</li>
            <li>Kebab</li>
            <li>Parmesanost</li>
            <li>Svartpeppar</li>
          </ul>
        `;
      }
 
      function showPizza() {
        document.getElementById("ingredients").innerHTML = `
          <h2>Pizza – Ingredienser</h2>
          <ul>
            <li>Pizzadeg</li>
            <li>Tomatsås</li>
            <li>Mozzarella</li>
            <li>Kyckling</li>
            <li>Oregano</li>
          </ul>
        `;
      }
    </script>
  </body>
</html>
